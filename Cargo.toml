[package]
name = "dependency-lens"
version = "0.1.0"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.44" }
taplo = "0.14"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
json-spanned-value = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
