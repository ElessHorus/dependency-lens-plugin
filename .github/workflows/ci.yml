name: CI

on:
  # Push runs on main only. Branches are covered by pull_request, so a PR does not run twice.
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**"]
  schedule:
    # Weekly, so a new OpenIDEA release that breaks the build shows up early.
    - cron: "17 5 * * 1"
  workflow_dispatch:

# The default token only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, so a moved tag cannot change what runs. The comment after
      # each SHA names the version. See docs/MAINTAINING.md to update them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The tag must match the SDK tag in Cargo.toml (`openidea-plugin` git dependency).
      # Keep both in sync when the SDK changes.
      - name: Install the plugin tool
        run: cargo install --locked --git https://github.com/l0ng-ai/openidea --tag v0.1.44 ide-host --bin openidea-plugin

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build and check the package
        run: openidea-plugin build

  # Early warning for the registry's rule: a plugin that fails the checks against a new
  # OpenIDEA release is delisted after 30 days without a fixed version. This job runs the
  # tool of the latest OpenIDEA release, so a breaking release shows here before the registry reports it.
  latest-release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Download the latest plugin tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download --repo l0ng-ai/openidea --pattern 'openidea-plugin-linux-x86_64.gz'
          gunzip openidea-plugin-linux-x86_64.gz
          chmod +x openidea-plugin-linux-x86_64

      - name: Build and check the package with the latest tool
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/openidea-plugin-linux-x86_64"
          "$tool" build
          "$tool" check
