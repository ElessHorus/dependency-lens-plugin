[project]
name = "demo"
version = "0.1.0"
description = "café"
dependencies = [
    "requests>=2.28.0",
    "click==8.1.7; python_version >= \"3.8\"",
]

[project.optional-dependencies]
docs = ["sphinx==7.2.6"]

[dependency-groups]
test = ["pytest==7.4.0", {include-group = "lint"}]
lint = ["ruff~=0.4.1"]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.27"
local = { path = "../local" }
attrs = { version = "^23.1", optional = true }

[tool.poetry.dev-dependencies]
mypy = "^1.5"

[tool.poetry.group.docs.dependencies]
black = "^24.0"
