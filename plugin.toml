id = "elesshorus.dependency-lens"
name = "Dependency Lens"
version = "0.1.2"
description = "Shows OSV vulnerabilities and newer versions inline in dependency manifests."
authors = ["The Dependency Lens authors"]
license = "MIT"
change-notes = "0.1.2 — privacy: a private index, repository or source (pip, uv, Poetry, Composer, Maven, Gemfile, Dart hosted, Cargo registry, Go replace) keeps the packages out of OSV and registry lookups, and a manifest-wide private source hides the whole file. New: the details of 10 advisories load per package, and the others load on request (the command Load all vulnerabilities, or the action in the hover); a quick fix that updates a vulnerable dependency to a fixed version, for all nine ecosystems; an informational problem for outdated dependencies (setting outdatedProblems). Fix: a request cancelled by the IDE no longer shows ?. 0.1.1 — fix: gems inside a Gemfile path, git or source block no longer reach OSV or the registry; PEP 508 constraints in parentheses, such as requests (==2.28.0), are now read. 0.1.0 — first release: OSV vulnerabilities for nine ecosystems; version hints and update quick fixes for Python, PHP, Dart, C# and Ruby."
# Marketplace categories (up to 3): languages, themes, icon-themes, linters,
# vcs, ai, frameworks, tools, other.
categories = ["tools"]
engines.openidea = "^1.4"
# Built by `openidea-plugin build`. The code is loaded the first time one of
# its commands runs; the commands below show in Find Action before that.
wasm = "dist/plugin.wasm"
activation = [
  "on-event:file-opened",
  "on-event:file-saved",
  "on-event:files-changed",
  "on-event:settings-changed",
  "on-command:*",
]

# What the code may do. The user approves these when installing.
[capabilities]
required = ["events", "project.read", "editor.read", "net:api.osv.dev", "net:pypi.org", "net:repo.packagist.org", "net:pub.dev", "net:api.nuget.org", "net:rubygems.org"]

[[contributes.commands]]
id = "refresh"
title = "Dependency Lens: Refresh"
category = "Dependency Lens"

[[contributes.commands]]
id = "load-vulnerabilities"
title = "Dependency Lens: Load all vulnerabilities"
category = "Dependency Lens"

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["*"]

[contributes.settings]
title = "Dependency Lens"
schema = "settings.schema.json"
